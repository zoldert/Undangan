<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Perayaan Natal - Gereja KIBAID Jemaat Ambon Kota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #f2ede4;
      --env-top: #fdfaf3;
      --env-body: #f6efe2;
      --gold-primary: #b88936;
      --gold-dark: #8c621d;
      --gold-light: #e6cf9b;
      --text-main: #2d261e;
      --text-muted: #6e6356;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg-outer) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Partikel Cahaya Latar */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      background: radial-gradient(circle, rgba(235, 194, 108, 0.9) 0%, rgba(235, 194, 108, 0) 70%);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }

    /* Kontainer Utama */
    .card-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      background: var(--env-body);
      border-radius: 24px;
      border: 1.5px solid rgba(184, 137, 54, 0.42);
      box-shadow: 0 22px 55px rgba(84, 62, 26, 0.18);
      overflow: hidden;
    }

    /* =========================================
       DESAIN SAMPUL AMPLOP NATAL (#cover-screen)
       ========================================= */
    #cover-screen {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, #f9f3e7 0%, #efe4d0 100%);
      text-align: center;
      overflow: hidden;
      animation: fadeIn 0.7s ease;
    }

    /* Garis tepi bagian dalam amplop */
    #cover-screen::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 1px solid rgba(184, 137, 54, 0.28);
      pointer-events: none;
      z-index: 4;
    }

    /* Bagian Tutup Amplop Segitiga Atas (Flap) */
    .envelope-flap {
      position: relative;
      width: 100%;
      height: 185px;
      background: linear-gradient(180deg, #ffffff 0%, #faf4e8 75%, #efe3cc 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 2;
      padding-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Garis tepi emas & bayangan lipatan segitiga amplop */
    .envelope-flap-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 189px;
      background: linear-gradient(180deg, rgba(184, 137, 54, 0.35) 0%, rgba(140, 98, 29, 0.45) 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 1;
      filter: drop-shadow(0 8px 12px rgba(84, 62, 26, 0.18));
    }

    .flap-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 6px;
    }

    .flap-ornament {
      font-size: 14px;
      color: var(--gold-primary);
      letter-spacing: 6px;
    }

    /* Segel Koin Emas Logo KIBAID di Ujung Lipatan Amplop */
    .wax-seal {
      position: relative;
      z-index: 3;
      width: 96px;
      height: 96px;
      margin: -48px auto 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffdf8 0%, #f5e6c8 65%, #d6b26e 100%);
      border: 3px solid #c99b42;
      box-shadow: 0 8px 22px rgba(92, 66, 22, 0.28), inset 0 0 10px rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      animation: sealGlow 3.5s ease-in-out infinite;
    }

    @keyframes sealGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 22px rgba(92, 66, 22, 0.28); }
      50% { transform: scale(1.03); box-shadow: 0 10px 28px rgba(184, 137, 54, 0.45); }
    }

    .wax-seal img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Badan Bawah Amplop */
    .envelope-body {
      position: relative;
      z-index: 2;
      padding: 4px 26px 34px;
    }

    .church-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .guest-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(184, 137, 54, 0.32);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 22px;
      box-shadow: 0 4px 12px rgba(84, 62, 26, 0.05);
    }

    .guest-box small {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .guest-box p {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .guest-box span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .btn-open {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #c84b22 0%, #9e3311 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(184, 68, 30, 0.34);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(184, 68, 30, 0.42);
    }

    .btn-open:active {
      transform: scale(0.98);
    }

    .cover-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* =========================================
       LAYAR ISI UNDANGAN (POSTER + INTERAKTIF)
       ========================================= */
    #main-content {
      display: none;
      animation: revealContent 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes revealContent {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .poster-container {
      width: 100%;
      line-height: 0;
      background: #f5efe6;
    }

    .poster-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Panel Interaktif di Bawah Poster */
    .interactive-panel {
      padding: 20px 20px 26px;
      background: linear-gradient(180deg, #ede5d8 0%, #f9f5ee 100%);
      border-top: 1px solid rgba(184, 137, 54, 0.28);
      text-align: center;
    }

    .panel-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 10px;
    }

    /* Hitung Mundur */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .cd-box {
      background: #ffffff;
      border: 1px solid rgba(184, 137, 54, 0.3);
      border-radius: 12px;
      padding: 8px 4px;
      box-shadow: 0 2px 8px rgba(84, 62, 26, 0.05);
    }

    .cd-num {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-dark);
      display: block;
    }

    .cd-text {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Tombol Aksi */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, #c5963e 0%, #9b7022 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 6px 16px rgba(155, 112, 34, 0.25);
    }

    .btn-rsvp-trigger {
      background: linear-gradient(135deg, #2d7a47 0%, #1e5932 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 6px 16px rgba(30, 89, 50, 0.22);
    }

    .btn-action:hover {
      transform: translateY(-1px);
    }

    /* Kotak Formulir Kesediaan Hadir (RSVP) */
    #rsvp-box {
      display: none;
      background: #ffffff;
      border: 1px solid rgba(184, 137, 54, 0.35);
      border-radius: 16px;
      padding: 16px 14px;
      margin-top: 14px;
      text-align: left;
      animation: fadeIn 0.35s ease;
    }

    #rsvp-box h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      text-align: center;
    }

    .rsvp-input, .rsvp-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(184, 137, 54, 0.4);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      color: var(--text-main);
      background: #fffdf9;
      margin-bottom: 10px;
    }

    .rsvp-input:focus, .rsvp-select:focus {
      outline: none;
      border-color: var(--gold-dark);
    }

    #rsvp-status-msg {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #eef8f1;
      border: 1px solid #b8dfc4;
      color: #1e5932;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
    }

    /* Tombol Musik Melayang */
    #music-toggle {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 50;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-dark);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .spinning {
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Pemutar File MP3 dari GitHub -->
  <audio id="bg-music" src="musik-natal.mp3" loop preload="auto"></audio>

  <div id="particles"></div>

  <div class="card-wrapper">

    <!-- LAYAR SAMPUL AMPLOP NATAL -->
    <div id="cover-screen">
      <div class="envelope-flap-shadow"></div>
      <div class="envelope-flap">
        <div class="flap-label">Undangan Perayaan Natal</div>
        <div class="flap-ornament">✦ ✦ ✦</div>
      </div>

      <!-- Segel Emas Logo Gereja KIBAID -->
      <div class="wax-seal">
        <img src="logo-kibaid.png" alt="Logo Gereja KIBAID">
      </div>

      <!-- Badan Amplop -->
      <div class="envelope-body">
        <h1 class="church-title">GEREJA KIBAID<br>JEMAAT AMBON KOTA</h1>

        <div class="guest-box">
          <small>Kepada Yth.</small>
          <p>Bapak/Ibu/Saudara(i)</p>
          <span>Di Tempat</span>
        </div>

        <button type="button" class="btn-open" onclick="bukaUndangan()">
          <span>✉️</span> Buka Undangan
        </button>
        <div class="cover-hint">Ketuk untuk membuka amplop undangan & musik</div>
      </div>
    </div>

    <!-- LAYAR ISI UNDANGAN (POSTER GAMBAR + TOMBOL INTERAKTIF) -->
    <div id="main-content">
      <div class="poster-container">
        <img src="kartu-undangan.jpg" alt="Undangan Perayaan Natal Gereja KIBAID Jemaat Ambon Kota">
      </div>

      <div class="interactive-panel">
        <div class="panel-label">Menuju Perayaan Natal</div>

        <!-- Hitung Mundur -->
        <div class="countdown-grid">
          <div class="cd-box"><span class="cd-num" id="cd-days">00</span><span class="cd-text">Hari</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-text">Jam</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-text">Menit</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-text">Detik</span></div>
        </div>

        <!-- Tombol Lokasi & RSVP -->
        <div class="action-buttons">
          <a href="https://maps.app.goo.gl/em8oBEZg6XqUvNvBA" target="_blank" rel="noopener" class="btn-action btn-gold">
            📍 Buka Lokasi di Google Maps
          </a>
          <button type="button" class="btn-action btn-rsvp-trigger" onclick="toggleRSVP()">
            ✍️ Kesediaan untuk Hadir (RSVP)
          </button>
        </div>

        <!-- Form Konfirmasi Kehadiran -->
        <div id="rsvp-box">
          <h4>Konfirmasi Kesediaan Hadir</h4>
          <input type="text" id="rsvp-nama" class="rsvp-input" placeholder="Tulis Nama Bapak/Ibu/Saudara(i)...">
          <select id="rsvp-status" class="rsvp-select">
            <option value="Ya, Saya Bersedia Hadir">Ya, Saya Bersedia Hadir</option>
            <option value="Hadir Bersama Keluarga">Hadir Bersama Keluarga</option>
            <option value="Maaf, Berhalangan Hadir">Maaf, Berhalangan Hadir</option>
          </select>
          <input type="number" id="rsvp-jumlah" class="rsvp-input" min="1" max="15" value="1" placeholder="Jumlah yang hadir (orang)">
          <button type="button" class="btn-action btn-rsvp-trigger" onclick="kirimRSVP()">
            Kirim Konfirmasi Kehadiran
          </button>
          <div id="rsvp-status-msg"></div>
        </div>
      </div>
    </div>

  </div>

  <button type="button" id="music-toggle" onclick="toggleMusik()" title="Putar / Jeda Musik">🎵</button>

  <script>
    // 1. Partikel Cahaya Emas
    (function buatPartikel() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 24; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const size = Math.random() * 6 + 3;
        spark.style.width = size + 'px';
        spark.style.height = size + 'px';
        spark.style.left = Math.random() * 100 + '%';
        spark.style.animationDuration = (Math.random() * 8 + 7) + 's';
        spark.style.animationDelay = (Math.random() * 6) + 's';
        container.appendChild(spark);
      }
    })();

    // 2. Kontrol Musik MP3
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');

    function mulaiMusik() {
      musicBtn.style.display = 'flex';
      bgMusic.play().then(() => {
        musicBtn.classList.add('spinning');
        musicBtn.textContent = '🎵';
      }).catch((err) => {
        console.log('Autoplay tertahan browser, ketuk tombol musik manual:', err);
        musicBtn.classList.remove('spinning');
        musicBtn.textContent = '🔇';
      });
    }

    function toggleMusik() {
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.classList.add('spinning');
        musicBtn.textContent = '🎵';
      } else {
        bgMusic.pause();
        musicBtn.classList.remove('spinning');
        musicBtn.textContent = '🔇';
      }
    }

    // 3. Buka Undangan
    function bukaUndangan() {
      mulaiMusik();
      document.getElementById('cover-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 4. Hitung Mundur ke 12 Desember 2026, 19:00 WIT (UTC+9)
    const targetDate = new Date('2026-12-12T19:00:00+09:00').getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;
      if (diff <= 0) {
        document.getElementById('cd-days').textContent = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent = '00';
        document.getElementById('cd-secs').textContent = '00';
        return;
      }
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-days').textContent = String(d).padStart(2, '0');
      document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
      document.getElementById('cd-mins').textContent = String(m).padStart(2, '0');
      document.getElementById('cd-secs').textContent = String(s).padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 5. Kesediaan untuk Hadir (RSVP)
    function toggleRSVP() {
      const box = document.getElementById('rsvp-box');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function kirimRSVP() {
      const nama = document.getElementById('rsvp-nama').value.trim();
      const status = document.getElementById('rsvp-status').value;
      const jumlah = document.getElementById('rsvp-jumlah').value || 1;
      const msgBox = document.getElementById('rsvp-status-msg');

      if (!nama) {
        alert('Silakan isi nama Bapak/Ibu/Saudara(i) terlebih dahulu.');
        return;
      }

      const scriptURL = "https://script.google.com/macros/s/AKfycbysnp7GbDWsm_tnTNOFfNwS54pv74z7pWSKBrBRS304YO23kj-LEWcICMRXkVNh8cA/exec";

      msgBox.style.display = 'block';
      msgBox.textContent = 'Sedang mengirim konfirmasi kehadiran...';

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama: nama, status: status, jumlah: jumlah })
      })
      .then(() => {
        msgBox.textContent = `Terima kasih, ${nama}. Konfirmasi "${status}" (${jumlah} orang) telah tersimpan!`;
        document.getElementById('rsvp-nama').value = '';
      })
      .catch(() => {
        msgBox.textContent = 'Terjadi gangguan jaringan. Silakan coba kirim ulang.';
      });
    }
  </script>
</body>
</html>
